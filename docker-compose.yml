services:
  db:
    image: postgres:17
    container_name: tailoring-db
    restart: unless-stopped
    # Credentials for LOCAL development only
    environment:
      POSTGRES_USER: tailoring
      POSTGRES_PASSWORD: tailoring_dev_pass
      POSTGRES_DB: tailoring_nb
    # host port 5433 -> container port 5432
    ports:
      - "5433:5432"
    # named volume keeps data alive between restarts
    volumes:
      - tailoring_db_data:/var/lib/postgresql/data

volumes:
  tailoring_db_data:
